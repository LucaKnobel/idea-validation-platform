name: CD Deploy

# Production deployment only. PR CI and branch protection already validated the
# merge, so a push to main builds, scans and publishes the image, then lets
# Coolify pull and restart it.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "bruno/**"
      - "README.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Only one production deployment at a time; never cancel a running one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7

      # Release metadata shown on /system-info and returned by /health.
      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=${image}"
            echo "version=$(date -u +%Y.%-m.%-d)-prod.${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once and load into the local daemon so Trivy scans exactly the
      # image that gets pushed. No secrets are passed: they are runtime-only.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_CHANNEL=prod
            APP_DEPLOYED_AT=${{ steps.meta.outputs.built_at }}
            APP_IMAGE_TAG=${{ steps.meta.outputs.image }}:${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

      # Informational scan: findings show up in the summary but never block.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Trivy summary
        if: always()
        run: bash .github/scripts/trivy-summary.sh trivy-image.json "${{ steps.meta.outputs.image }}:${{ github.sha }}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Push image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to Coolify (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      # Coolify pulls :latest and restarts the container (migrations run on start).
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_AUTH_TOKEN}" \
            "${COOLIFY_WEBHOOK}"

      # The webhook only queues the deployment. Poll /health until the new
      # commit is live; fail after ~10 minutes.
      - name: Verify deployed commit
        env:
          HEALTH_URL: ${{ vars.APP_URL }}/health
        run: |
          set -euo pipefail
          live=""
          for attempt in $(seq 1 40); do
            live=$(curl --silent --max-time 10 "${HEALTH_URL}" | jq -r '.commit // empty' 2>/dev/null || true)
            if [[ "${live}" == "${GITHUB_SHA}" ]]; then
              echo "Commit ${GITHUB_SHA} is live (attempt ${attempt})."
              {
                echo "## Production deployment"
                echo ""
                echo "- Image: \`${{ needs.image.outputs.image }}:${GITHUB_SHA}\`"
                echo "- Live after ${attempt} check(s): ${{ vars.APP_URL }}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}: live=${live:-none}, expected=${GITHUB_SHA}"
            sleep 15
          done
          echo "::error::Deployment not verified: expected ${GITHUB_SHA}, last seen ${live:-none}"
          exit 1
